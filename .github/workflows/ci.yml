name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Install dependencies
        run: just deps

      # 生成物（*.g.dart / *.freezed.dart / *.gr.dart / *.config.dart / app_localizations*）
      # 不入库，analyze / test 前必须现场生成。策略与重新生成时机见
      # .trellis/spec/cross-cutting.md「代码生成与生成物」。
      - name: Generate code
        run: just codegen

      # 「过期」不等于「有漏洞」，也不等于必须马上升 —— 所以这一步**只报告**：
      # 实测 dart pub outdated 有可升级项时仍返回 0，判定口径不在它的退出码上；
      # continue-on-error 把这层意思写死，免得哪天 SDK 改了退出码就变成硬门禁。
      # 升级时机由人按 docs/release-checklist.md 排；真正的安全门禁是 osv-scan job。
      - name: Report outdated dependencies (informational)
        run: dart pub outdated
        continue-on-error: true

      # 格式、两步 analyze（app_lints 插件 + very_good_analysis，含依赖声明规则）、
      # 插件规则测试、目录树一致性、单元与 widget 测试 —— 本地同一条
      # 命令，原样跑一遍。analyze **必须显式传文件名**（传目录会静默丢插件诊断），
      # 口径与调用形式见 .trellis/spec/cross-cutting.md；CI 不另写第二份。
      - name: Run gates (just verify)
        run: just verify

      # 改名脚本的回归：`tool/init_project.dart` 会把仓库复制到临时目录、真的改一次名，
      # 再用 flutter analyze 验证改完的仓库自洽（import 没断、包名一致）。
      # SCAFFOLD_E2E=1 才跑那条端到端用例 —— 它要 pub get + analyze，慢。
      - name: Regression test (rename scaffold in temp dir)
        run: just test test/tool/init_project_test.dart
        env:
          SCAFFOLD_E2E: "1"

  # 单元与 widget 测试没有单独 job：`just verify` 已经跑了 `flutter test`。
  integration-test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub 的 ubuntu runner 要显式开 KVM，模拟器才走硬件加速（否则慢到超时）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          # JDK 17 是 AGP 9.x / Gradle 9.x 的最低要求，也与
          # android/app/build.gradle.kts 的 JavaVersion.VERSION_17 保持一致
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Install dependencies
        run: just deps

      # 生成物不入库，集成测试同样要现场生成
      - name: Generate code
        run: just codegen

      # 目标平台是 Android / iOS，集成测试就跑在 Android 模拟器上。
      # 不要用 xvfb：那是给 Linux 桌面目标用的，本项目没有 linux/ 平台目录。
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # 不要传 emulator-options —— 一旦指定会覆盖 action 的全部默认值
          # （默认已含 -no-window / -gpu swiftshader_indirect，headless 需要它们）
          script: just e2e

  # ── 供应链门禁：拿 pubspec.lock 去 OSV 数据库查**已知漏洞**，命中即失败 ──
  # 它和 `depend_on_referenced_packages` 是两件事：后者管「声明与使用是否一致」，这里管
  # 「锁定住的版本有没有被披露过漏洞」。口径与理由见 .trellis/spec/cross-cutting.md。
  #
  # 用官方 reusable workflow 而不是自己拼 `run: osv-scanner …`：CLI 参数在
  # v1 → v2 变过（子命令化），手写的调用会在某次升级后静默失效或直接报错。
  osv-scan:
    # reusable workflow 在 job 级声明了 security-events: write，而本仓库默认 token 权限是
    # read（Settings → Actions → Workflow permissions）。caller 不显式授予时 GitHub 在
    # 启动阶段就拒收整个 workflow：run 直接 startup_failure、一个 job 都不生成，日志里
    # 也没有 failed step 可看。所以这里按被调方的声明逐项对齐授予。
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      # 只扫根工程与独立插件包的 lockfile。默认的 `-r ./` 会把 build/、
      # .dart_tool/ 这些产物一并扫进去，又慢又吵。
      scan-args: |-
        --lockfile=./pubspec.lock
        --lockfile=./packages/app_lints/pubspec.lock
      # 结果只落在 job 日志里，不上传 Code Scanning —— 私有仓库或没开
      # Code Scanning 的仓库不会因为这一步变红；要那份展示就改成 true。
      upload-sarif: false
      # 发现漏洞即失败。显式写出来，免得哪天改成依赖默认值。
      fail-on-vuln: true
