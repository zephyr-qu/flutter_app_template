name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Install dependencies
        run: just deps

      # 生成物（*.g.dart 等）不入库，analyze / test 前必须现场生成。
      # 策略见 cross-cutting.md「代码生成与生成物」。
      - name: Generate code
        run: just codegen

      # 「过期」≠「有漏洞」：这一步只报告，不拦（真正的安全门禁是 osv-scan）。
      # 升级时机见 docs/release-checklist.md。
      - name: Report outdated dependencies (informational)
        run: dart pub outdated
        continue-on-error: true

      # 格式、两步 analyze（app_lints + riverpod_lint）、插件规则测试、单元与
      # widget 测试 —— 本地同一条命令，原样跑一遍。analyze 必须显式传文件名
      # （传目录会丢插件诊断），细节见 cross-cutting.md；CI 不另写第二份口径。
      - name: Run gates (just verify)
        run: just verify

      # 改名脚本的回归：`tool/init_project.dart` 会把仓库复制到临时目录、真的改一次名，
      # 再用 flutter analyze 验证改完的仓库自洽（import 没断、包名一致）。
      # SCAFFOLD_E2E=1 才跑那条端到端用例 —— 它要 pub get + analyze，慢。
      - name: Regression test (rename scaffold in temp dir)
        run: just test test/tool/init_project_test.dart
        env:
          SCAFFOLD_E2E: "1"

  # 单元与 widget 测试没有单独 job：`just verify` 已经运行了 `flutter test`。
  integration-test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 的 ubuntu runner 要显式开 KVM，模拟器才走硬件加速（否则慢到超时）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          # JDK 17 是 AGP 9.x / Gradle 9.x 的最低要求，也与
          # android/app/build.gradle.kts 的 JavaVersion.VERSION_17 保持一致
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Install dependencies
        run: just deps

      # 目标平台是 Android / iOS，集成测试就跑在 Android 模拟器上。
      # 不要用 xvfb：那是给 Linux 桌面目标用的，本项目没有 linux/ 平台目录。
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # 不要传 emulator-options —— 一旦指定会覆盖 action 的全部默认值
          # （默认已含 -no-window / -gpu swiftshader_indirect，headless 需要它们）
          script: just test integration_test/

  # 供应链门禁：拿 pubspec.lock 去 OSV 查**已知漏洞**，命中即失败。
  # 与 `dart pub outdated`（只报告）分工；口径见 cross-cutting.md「供应链门禁」。
  # 用官方 reusable workflow：CLI 参数 v1→v2 变过，手写调用会静默失效。
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      # 只扫根工程与独立插件包的 lockfile。默认的 `-r ./` 会把 build/、
      # .dart_tool/ 这些产物一并扫进去，又慢又吵。
      scan-args: |-
        --lockfile=./pubspec.lock
        --lockfile=./packages/app_lints/pubspec.lock
      # 结果只落在 job 日志里，不上传 Code Scanning —— 私有仓库或没开
      # Code Scanning 的仓库不会因为这一步变红；要那份展示就改成 true。
      upload-sarif: false
      # 发现漏洞即失败。显式写出来，免得哪天改成依赖默认值。
      fail-on-vuln: true
