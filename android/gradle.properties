org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 起 newDsl / builtInKotlin 默认翻转为 true，但 Flutter 的 Gradle 插件
# （dev.flutter.flutter-gradle-plugin）目前仍只兼容旧 DSL + 外部 KGP：
#   - newDsl=true 会让 Flutter 插件挂载失败（只读新 DSL 接口，旧 BaseExtension 被隐藏）
#   - builtInKotlin=true 会与 settings.gradle.kts 里声明的 kotlin-android 插件冲突
# Flutter 3.47.x 的 Android 模板同样显式关闭这两个开关，升级 AGP 时请勿顺手打开。
# 参考：https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.newDsl=false
android.builtInKotlin=false
