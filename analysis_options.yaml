# 分析器配置。
#
# 规则集由 very_good_analysis 提供（`include:`）。换规则集时必须同步改
# `pubspec.yaml` 的 dev_dependencies、删掉旧的那个包 —— 留着没人用的声明，
# 现在没有任何门禁会抓（详见 .trellis/spec/cross-cutting.md 的「依赖声明」）。
#
# 本文件只放两类内容：规则集之外的 analyzer 设置，以及**对本项目不成立**的规则。
# 单条豁免写进对应代码（`// ignore: rule -- 理由`），不要往这里堆。

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # ── 与本项目的形态冲突，长期关闭 ──
    #
    # 应用工程，不是要发布的 package：没有外部调用方需要 API 文档。
    # 打开它要给 118 个成员补文档，产出的是「/// 构造函数」这类流水账。
    public_member_api_docs: false

    # 边界处就是要有意地兜住一切（runCatching / 网络层 / ViewModel）。
    # `on Object catch (e)` 与 `catch (e)` 语义完全相同，只是把行写长。
    avoid_catches_without_on_clauses: false

    # 该规则偏好同步的 dart:io。Flutter 里同步 IO 会阻塞 UI 线程，异步才是对的。
    avoid_slow_async_io: false

# ──────────────────────────────────────────────
# 架构边界与约定（非 analyzer 规则）
# ──────────────────────────────────────────────
# 这两类检查**不是** analyzer 插件，而是脚本——门禁跑的是 `flutter analyze lib/ test/`，
# 而 `flutter analyze`（无论传文件还是目录）不加载 analyzer 插件；`dart analyze` 会加载，
# 但只在传**单个文件**时（实测表见 .trellis/spec/cross-cutting.md）。历史上
# `features/profile/page` 引用过 `features/auth/logic` 而 analyze 报「No issues found」，
# 就是这个原因。所以它们在 CI 与 pre-commit 里以脚本方式跑：
#
#   dart run tool/check_boundaries.dart    # 依赖方向 + logic 层不得手动建容器 / 不得依赖 Flutter UI
#   dart run tool/check_conventions.dart   # build 里禁用 ref.read 取值、注释块上限
#
# 细节见 tool/ 下的脚本与 .trellis/spec/cross-cutting.md。

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
