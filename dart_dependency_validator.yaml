# dependency_validator 的配置（`dart run dependency_validator`）
#
# 为什么不写在 pubspec.yaml：那个位置已废弃 —— `pub publish` 会对无法识别的键报警告。
# 为什么不 `dart pub global activate`：作为 dev_dependency 声明后版本被锁进
# pubspec.lock，CI 与本地跑的是同一份。
#
# 当前豁免一项，理由写在下面 —— 每条都必须给出「为什么这是误报」，
# 依据见 .trellis/spec/cross-cutting.md 的「依赖检查」。
#
# `json_annotation`：这是**构建期契约**，不是冗余声明。`json_serializable` 生成
# `lib/` 下的代码时要求它出现在 pubspec 的 `dependencies` 且下界 ≥ 4.12.0（判据在
# 该包的 `lib/src/check_dependencies.dart`）；但源码里不会出现它的 import ——
# `@JsonKey` 只出现在生成的 `sample_item.freezed.dart` 里，符号经 `freezed_annotation`
# 的 re-export 提供。于是这里判它 unused，是误报。
ignore:
  - json_annotation
