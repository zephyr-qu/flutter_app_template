name: my_app
description: "个人 Flutter 脚手架：FSD 结构 + Signals + auto_route + Retrofit/Drift 离线缓存"
publish_to: "none"
version: 1.0.0+1

environment:
  # 下限由依赖集决定（见 pubspec.lock 的 sdks 段），改这里要同步 CI 与 README
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.0"

# ──────────────────────────────────────────────
# 生产依赖（编译和运行期都需要）
# ──────────────────────────────────────────────
dependencies:
  # ── 共享基础设施（与状态管理无关，signals / Riverpod 双栈共用） ──
  app_core:
    path: packages/app_core

  flutter:
    sdk: flutter

  # ── State Management ──
  signals_flutter: ^7.1.0
  signals_hooks: ^7.1.0
  flutter_hooks: ^0.21.3+1

  # ── Dependency Injection ──
  get_it: ^9.2.0
  injectable: ^3.0.0 # 运行时注解，DI 自动注册

  # ── Network & API ──
  # dio_smart_retry / pretty_dio_logger 只被 app_core 的 Dio 工厂使用，声明在包里
  dio: ^5.10.0
  msw_dio_interceptor: ^1.0.5 # Mock API（应用专属规则在 core/data/network/dio_client.dart）
  retrofit: ^4.9.2 # 运行时注解，API 客户端生成

  # ── Data & Persistence ──
  # path_provider 只被 app_core 的 database / file_storage 使用，声明在包里
  shared_preferences: ^2.5.3
  drift: ^2.34.1 # 运行时注解，数据库引擎；原生 SQLite 由 sqlite3 3.x 的 build hook 提供

  # ── Serialization（运行时依赖） ──
  json_annotation: ^4.12.0 # @JsonSerializable 注解
  freezed_annotation: ^3.1.0 # @freezed 注解

  # ── Routing（运行时依赖） ──
  auto_route: ^11.1.0 # @RoutePage 注解

  # ── Utils ──
  # logger 只被 app_core 的 logging 使用，声明在包里
  flutter_dotenv: ^6.0.0
  leak_tracker: ^11.0.2 # 内存泄漏检测（debug 模式自动启用）
  flutter_secure_storage: ^11.2.0

# ──────────────────────────────────────────────
# 开发依赖（编译期工具、调试、测试）
# ──────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code Gen：序列化 ──
  json_serializable: ^6.9.3 # 生成 toJson/fromJson
  freezed: ^4.0.1 # 生成 copyWith/==/hashCode

  # ── Code Gen：DI ──
  injectable_generator: ^3.1.0 # 生成 ServiceLocator 注册代码

  # ── Code Gen：API ──
  retrofit_generator: ^10.2.1 # 生成 Retrofit 客户端实现

  # ── Code Gen：数据库 ──
  drift_dev: ^2.34.2+1 # 生成 Drift DAO 代码

  # ── Code Gen：路由 ──
  auto_route_generator: ^10.6.0

  # ── Code Gen：通用 ──
  build_runner: ^2.4.14 # codegen 执行引擎

  # ── 测试 ──
  mocktail: ^1.0.5
  leak_tracker_flutter_testing: ^3.0.10 # 测试内存泄漏检测

  # ── Lint 规则集 ──
  # 由 analysis_options.yaml 的 `include:` 引用。换规则集时必须同步删掉旧的那个：
  # dependency_validator 只认被 include 的包，留着会被判成「声明了没用」。
  very_good_analysis: ^11.0.0

  # ── 构建工具 ──
  flutter_launcher_icons: ^0.14.4
  dependency_validator: ^5.1.0
  analyzer: ^13.3.0

# ──────────────────────────────────────────────
# 插件配置
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.development
    - .env.production
