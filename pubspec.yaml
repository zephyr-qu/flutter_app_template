name: my_app
description: "个人 Flutter 脚手架：FSD 结构 + Riverpod + auto_route + Retrofit/Drift 离线缓存"
publish_to: "none"
version: 1.0.0+1

environment:
  # 下限由依赖集决定（见 pubspec.lock 的 sdks 段），改这里要同步 CI 与 README
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.0"

# ──────────────────────────────────────────────
# 生产依赖（编译和运行期都需要）
# ──────────────────────────────────────────────
dependencies:
  # ── 共享基础设施（与状态管理无关，signals / Riverpod 双栈共用） ──
  app_core:
    path: packages/app_core

  flutter:
    sdk: flutter

  # ── State Management ──
  # 本分支是 Riverpod 栈（preset/ai-starter）。与 master 的 signals 栈**互不合并**：
  # 状态管理是分支的差异本身，两套混用只会互相覆盖（见 BRANCH.md）。
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7 # @riverpod 注解；Ref 类型由 riverpod 提供

  # 依赖注入由 Riverpod provider 承担 —— `lib/di/` 在本分支不存在，
  # get_it / injectable 与它们的 generator 因此一起移除。

  # ── Network & API ──
  # dio_smart_retry / pretty_dio_logger 只被 app_core 的 Dio 工厂使用，声明在包里
  dio: ^5.10.0
  msw_dio_interceptor: ^1.0.5 # Mock API（应用专属规则在 core/data/network/dio_client.dart）
  retrofit: ^4.9.2 # 运行时注解，API 客户端生成

  # ── Data & Persistence ──
  # path_provider 只被 app_core 的 database / file_storage 使用，声明在包里。
  # drift 的数据库与表都在 app_core（那里才是它的运行时使用者）；根工程只在
  # **测试**里用 `package:drift/native.dart` 建内存库，所以它声明在 dev_dependencies。
  shared_preferences: ^2.5.3

  # ── Serialization（运行时依赖） ──
  json_annotation: ^4.12.0 # @JsonSerializable 注解
  freezed_annotation: ^3.1.0 # @freezed 注解

  # ── Routing（运行时依赖） ──
  auto_route: ^11.1.0 # @RoutePage 注解

  # ── Utils ──
  # logger 只被 app_core 的 logging 使用，声明在包里
  flutter_dotenv: ^6.0.0
  leak_tracker: ^11.0.2 # 内存泄漏检测（debug 模式自动启用）
  flutter_secure_storage: ^11.2.0

# ──────────────────────────────────────────────
# 开发依赖（编译期工具、调试、测试）
# ──────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code Gen：序列化 ──
  json_serializable: ^6.9.3 # 生成 toJson/fromJson
  freezed: ^4.0.1 # 生成 copyWith/==/hashCode

  # ── Code Gen：Riverpod ──
  # 生成 provider 的 *.g.dart。**没有 riverpod_lint / custom_lint**：
  # custom_lint 所有版本都要求 analyzer <8 或 ^8，而本项目钉定 analyzer 13
  # （drift_dev / retrofit_generator / tool/check_conventions.dart 都依赖它）；
  # riverpod_lint 3.1.9 起走 analysis_server_plugin —— 只在 IDE 生效，CI 不执行，
  # 与「门禁逻辑一律用脚本」的既有立场冲突。
  # 禁止模式改由 tool/check_boundaries.dart 的规则兜（那里在 CI 里真的会跑）。
  riverpod_generator: ^4.0.9

  # ── Code Gen：API ──
  retrofit_generator: ^10.2.1 # 生成 Retrofit 客户端实现

  # ── Code Gen / 测试：Drift ──
  drift: ^2.34.1 # 原生 SQLite 由 sqlite3 3.x 的 build hook 提供
  drift_dev: ^2.34.2+1 # 生成 Drift DAO 代码

  # ── Code Gen：路由 ──
  auto_route_generator: ^10.6.0

  # ── Code Gen：通用 ──
  build_runner: ^2.4.14 # codegen 执行引擎

  # ── 测试 ──
  mocktail: ^1.0.5
  leak_tracker_flutter_testing: ^3.0.10 # 测试内存泄漏检测

  # ── Lint 规则集 ──
  # 由 analysis_options.yaml 的 `include:` 引用。换规则集时必须同步删掉旧的那个：
  # dependency_validator 只认被 include 的包，留着会被判成「声明了没用」。
  very_good_analysis: ^11.0.0

  # ── 构建工具 ──
  flutter_launcher_icons: ^0.14.4
  dependency_validator: ^5.1.0
  analyzer: ^13.3.0

# ──────────────────────────────────────────────
# 插件配置
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.development
    - .env.production
