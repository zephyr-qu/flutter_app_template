name: my_app
description: "个人 Flutter 脚手架：FSD 结构 + Riverpod + auto_route + Retrofit/Drift 离线缓存"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

# ──────────────────────────────────────────────
# 生产依赖（编译和运行期都需要）
# ──────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7 # @riverpod 注解；Ref 类型由 riverpod 提供

  # ── Network & API ──
  dio: ^5.10.0
  dio_smart_retry: ^7.0.1 # core/data/network/dio_factory.dart 的重试策略
  msw_dio_interceptor: ^1.0.5 # Mock API（应用专属规则在 core/data/network/dio_client.dart）
  pretty_dio_logger: ^1.4.0 # core/data/network/dio_factory.dart 的调试日志
  retrofit: ^4.9.2 # 运行时注解，API 客户端生成

  # ── Data & Persistence ──
  drift: ^2.34.1 # 数据库与表在 lib/core/data/database/，运行期需要
  path_provider: ^2.1.0 # core/data/database 与 core/data/storage 取应用目录
  shared_preferences: ^2.5.3

  # ── Serialization（运行时依赖） ──
  json_annotation: ^4.12.0 # @JsonSerializable / @JsonKey 注解
  freezed_annotation: ^3.1.0 # @freezed 注解

  # ── Routing（运行时依赖） ──
  auto_route: ^11.2.0 # @RoutePage 注解（11.2.0 起带入 cupertino_ui / material_ui）

  # ── Theme ──
  flex_color_scheme: ^8.4.0 # core/theme/app_theme.dart（仅此一处使用）

  # ── Utils ──
  flutter_dotenv: ^6.0.0
  leak_tracker: ^11.0.2 # 内存泄漏检测（debug 模式自动启用）
  logger: ^2.6.2 # core/logging/logging.dart

# ──────────────────────────────────────────────
# 开发依赖（编译期工具、调试、测试）
# ──────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code Gen：序列化 ──
  json_serializable: ^6.9.3 # 生成 toJson/fromJson
  freezed: ^4.0.1 # 生成 copyWith/==/hashCode

  # ── Code Gen：Riverpod ──
  riverpod_lint: ^3.1.9
  riverpod_generator: ^4.0.9

  # ── Code Gen：API ──
  retrofit_generator: ^10.2.1 # 生成 Retrofit 客户端实现

  # ── Code Gen：Drift ──
  drift_dev: ^2.34.2+1 # 生成 Drift 数据库 / DAO 代码（drift 运行期依赖见 dependencies）

  # ── Code Gen：路由 ──
  auto_route_generator: ^10.6.0

  # ── Code Gen：通用 ──
  build_runner: ^2.4.14 # codegen 执行引擎

  # ── 测试 ──
  mocktail: ^1.0.5
  leak_tracker_flutter_testing: ^3.0.10 # 测试内存泄漏检测

  # ── Lint 规则集 ──
  # 换规则集的同步义务见 cross-cutting.md「依赖声明」。
  very_good_analysis: ^11.0.0

  # ── 构建工具 ──
  flutter_launcher_icons: ^0.14.4
  analyzer: ^13.3.0

# ──────────────────────────────────────────────
# 插件配置
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env.example
