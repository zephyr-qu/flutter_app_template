name: my_app
description: "个人 Flutter 脚手架：FSD 结构 + Riverpod + auto_route + Retrofit/Drift 离线缓存"
publish_to: "none"
version: 1.0.0+1

environment:
  # 下限由依赖集决定（见 pubspec.lock 的 sdks 段），改这里要同步 CI 与 README。
  # flutter 下限当前由 auto_route 11.2.0 间接带入的 cupertino_ui / material_ui
  # （二者均要求 >=3.47.0）决定 —— 升 auto_route 前先看它会把这行抬到哪。
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

# ──────────────────────────────────────────────
# packages/ 的定位
# ──────────────────────────────────────────────
# 这里只放**真正独立的工具包**（当前是 `packages/app_lints`——架构边界插件）。
# app 代码不抽包：`lib/core/` 保持拍平（它曾经是 `packages/app_core`，2026-09-23 拍平回来）。
#
# 插件包**不并进 workspace**：它要 `analysis_server_plugin` 的当前版本（连带 analyzer
# 14.x），而本工程钉 `analyzer ^13.3.0`（`drift_dev` / `retrofit_generator` 要），两者
# 放不进同一次解析。所以它在自己目录里有独立的 pubspec.lock 与 .dart_tool；`just deps`
# 会分别执行根工程与 `packages/app_lints` 的依赖解析，门禁的 analyze 与插件测试都依赖
# 这两份 package config。换来的是插件能跟着 SDK 单独升级，不被本工程的 analyzer 上限拖住。

# ──────────────────────────────────────────────
# 生产依赖（编译和运行期都需要）
# ──────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  # 本分支是 Riverpod 栈（preset/ai-starter）。与 master 的 signals 栈**互不合并**：
  # 状态管理是分支的差异本身，两套混用只会互相覆盖（见 BRANCH.md）。
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7 # @riverpod 注解；Ref 类型由 riverpod 提供

  # 依赖注入由 Riverpod provider 承担 —— `lib/di/` 在本分支不存在，
  # get_it / injectable 与它们的 generator 因此一起移除。

  # ── Network & API ──
  dio: ^5.10.0
  dio_smart_retry: ^7.0.1 # core/data/network/dio_factory.dart 的重试策略
  msw_dio_interceptor: ^1.0.5 # Mock API（应用专属规则在 core/data/network/dio_client.dart）
  pretty_dio_logger: ^1.4.0 # core/data/network/dio_factory.dart 的调试日志
  retrofit: ^4.9.2 # 运行时注解，API 客户端生成

  # ── Data & Persistence ──
  drift: ^2.34.1 # 数据库与表在 lib/core/data/database/，运行期需要
  path_provider: ^2.1.0 # core/data/database 与 core/data/storage 取应用目录
  shared_preferences: ^2.5.3

  # ── Serialization（运行时依赖） ──
  json_annotation: ^4.12.0 # @JsonSerializable / @JsonKey 注解
  freezed_annotation: ^3.1.0 # @freezed 注解

  # ── Routing（运行时依赖） ──
  auto_route: ^11.2.0 # @RoutePage 注解（11.2.0 起带入 cupertino_ui / material_ui）

  # ── Theme ──
  flex_color_scheme: ^8.4.0 # core/theme/app_theme.dart（本分支仅此一处使用）

  # ── Utils ──
  flutter_dotenv: ^6.0.0
  leak_tracker: ^11.0.2 # 内存泄漏检测（debug 模式自动启用）
  logger: ^2.6.2 # core/logging/logging.dart

# ──────────────────────────────────────────────
# 开发依赖（编译期工具、调试、测试）
# ──────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code Gen：序列化 ──
  json_serializable: ^6.9.3 # 生成 toJson/fromJson
  freezed: ^4.0.1 # 生成 copyWith/==/hashCode

  # ── Code Gen：Riverpod ──
  # 生成 provider 的 *.g.dart 用 riverpod_generator。
  # riverpod_lint 3.1.9 也已接入（见 analysis_options.yaml 顶层 `plugins:` 块）：
  # 它自 3.1.0 起改用 analysis_server_plugin，与本项目钉定的 analyzer 13.3.0 兼容
  # （实测 `dart pub get` 解析通过）。但 `flutter analyze` 不加载它——`dart analyze`
  # 只在**显式传文件名**时给出插件诊断，传目录会丢（2026-09-24 探针复测，见
  # .trellis/spec/cross-cutting.md）。根 justfile 的 analyze 两步
  # 因此是 `dart analyze --fatal-infos` + 显式传 lib/test/tool/packages 的手写
  # 文件列表，保证 riverpod_lint 与 app_lints 在 CI 里真的会跑。
  # 它没覆盖到的「依赖方向 / 跨 feature 只共享 data / logic 层纯度 / build 里禁
  # ref.read 取值」由本仓库自己的插件兜：packages/app_lints/（同一个 `plugins:` 段）。
  riverpod_lint: ^3.1.9
  riverpod_generator: ^4.0.9

  # ── Code Gen：API ──
  retrofit_generator: ^10.2.1 # 生成 Retrofit 客户端实现

  # ── Code Gen：Drift ──
  drift_dev: ^2.34.2+1 # 生成 Drift 数据库 / DAO 代码（drift 运行期依赖见 dependencies）

  # ── Code Gen：路由 ──
  auto_route_generator: ^10.6.0

  # ── Code Gen：通用 ──
  build_runner: ^2.4.14 # codegen 执行引擎

  # ── 测试 ──
  mocktail: ^1.0.5
  leak_tracker_flutter_testing: ^3.0.10 # 测试内存泄漏检测

  # ── Lint 规则集 ──
  # 由 analysis_options.yaml 的 `include:` 引用。换规则集时必须同步删掉旧的那个包，
  # 否则 pubspec 里会留一个没人用的声明 —— 现在没有门禁会抓这个（见
  # .trellis/spec/cross-cutting.md 的「依赖声明」）。
  very_good_analysis: ^11.0.0

  # ── 构建工具 ──
  flutter_launcher_icons: ^0.14.4
  analyzer: ^13.3.0

# ──────────────────────────────────────────────
# 插件配置
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.development
    - .env.production
