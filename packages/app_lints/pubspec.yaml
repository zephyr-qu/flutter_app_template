name: app_lints
description: 本仓库的架构边界与代码形态规则（analysis_server_plugin 插件）。
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  # 独立解析：跟 SDK 自带的 analysis_server_plugin 对齐（Dart 3.13.2 下是 0.3.23）。
  # 它连带 analyzer 14.4.0，比 SDK 自带的 analyzer 新——本包自带 package config，
  # 与根工程的依赖解析互不干扰。
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0

dev_dependencies:
  analyzer_testing: ^0.4.2
  test_reflective_loader: ^0.4.0
