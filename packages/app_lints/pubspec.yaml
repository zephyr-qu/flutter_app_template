name: app_lints
description: 本仓库的架构边界与代码形态规则（analysis_server_plugin 插件）。
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  # 独立解析：插件由 SDK 宿主（`dart analyze`）加载，所以这里的版本跟 SDK 自带的
  # analysis_server_plugin 保持同一次版本线（0.3.x）。本包自带 package config，
  # 与根工程的依赖解析互不干扰。
  analysis_server_plugin: ^0.3.24
  analyzer: ^14.5.0

dev_dependencies:
  analyzer_testing: ^0.4.3
  test_reflective_loader: ^0.6.0
