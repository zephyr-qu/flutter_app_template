# 与根工程同一套规则集（见根 analysis_options.yaml 的说明）。
# 这里只重复「对本包成立」的豁免；新增豁免优先写进代码的 `// ignore: rule -- 理由`。
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**

linter:
  rules:
    # ── 与根工程一致、与本项目形态冲突的豁免（理由同根 analysis_options.yaml） ──
    #
    # 内部包，`publish_to: none`，没有外部调用方需要 API 文档。
    public_member_api_docs: false

    # 边界处就是要有意地兜住一切（file_storage 的读写失败降级）。
    avoid_catches_without_on_clauses: false

    # 该规则偏好同步的 dart:io。Flutter 里同步 IO 会阻塞 UI 线程。
    avoid_slow_async_io: false
